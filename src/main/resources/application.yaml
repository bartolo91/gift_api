spring:
  application:
    name: gift_api

  datasource:
    url: jdbc:h2:file:~/gift_api
    username: sa
    password: password

  jpa:
    show-sql: true
    generate-ddl: true
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none

  h2:
    console:
      enabled: true
      path: /h2

  sql:
    init:
      platform: h2