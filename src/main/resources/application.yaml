server:
  port: 8080

spring:
  profiles:
    active: mysql
  liquibase:
    change-log: classpath:/db/db.changelog-master.yaml

scheduler:
  present-processing:
    cron: "*/5 * * * * *"
    lock-at-most-for: "5m"
    lock-at-least-for: "20s"
    default-lock-at-most-for: 30s
    scheduler-lock-name: present-processing

present:
  processing:
    page-size: 1000
    limit-price: 100

async:
  executor:
    core-pool-size: 10
    max-pool-size: 20
    queue-capacity: 200
    thread-name-prefix: gift-async-
