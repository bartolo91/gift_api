databaseChangeLog:
  - changeSet:
      id: 01-create-child
      author: bartek
      preConditions:
      - onFail: MARK_RAN
      - not:
          - tableExists:
              tableName: child
      changes:
        - createTable:
            tableName: child
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(255)
              - column:
                  name: last_name
                  type: VARCHAR(255)
              - column:
                  name: birth_date
                  type: DATE
