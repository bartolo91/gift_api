databaseChangeLog:
  - changeSet:
      id: 02-create-present
      author: bartek

      changes:
        - createTable:
            tableName: present
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)

              - column:
                  name: price
                  type: DECIMAL(19,2)

              - column:
                  name: child_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: present
            baseColumnNames: child_id
            referencedTableName: child
            referencedColumnNames: id
            constraintName: fk_present_child

        - createIndex:
            tableName: present
            columns:
              - column:
                  name: child_id
            indexName: idx_present_child